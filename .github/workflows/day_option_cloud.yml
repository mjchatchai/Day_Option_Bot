name: Day Option Bot Cloud Runner (First 2 Hours Prime Window)

on:
  schedule:
    # Pre-warm & Multi-anchor triggers for US Market Open (09:35 - 11:30 NY)
    # Summer EDT (13:15, 13:35 UTC) & Winter EST (14:00, 14:20, 14:35 UTC)
    - cron: '15 13 * * 1-5'
    - cron: '35 13 * * 1-5'
    - cron: '0 14 * * 1-5'
    - cron: '20 14 * * 1-5'
    - cron: '35 14 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode (scan_once, live_session_2h, or backtest_90d)'
        required: false
        default: 'scan_once'
        type: choice
        options:
          - scan_once
          - live_session_2h
          - backtest_90d

permissions:
  contents: write

concurrency:
  group: day-option-cloud-runner-${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'live_session_2h' && 'fast-scan' || 'live-session' }}
  cancel-in-progress: false

jobs:
  run-day-option-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: "Execute Day Option Bot (First 2 Hours Window 09:35 - 11:30 NY)"
        env:
          DAY_OPTION_TELEGRAM_BOT_TOKEN: ${{ secrets.DAY_OPTION_TELEGRAM_BOT_TOKEN }}
          DAY_OPTION_TELEGRAM_CHAT_ID: ${{ secrets.DAY_OPTION_TELEGRAM_CHAT_ID }}
        run: |
          NY_DATE=$(TZ="America/New_York" date +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.mode }}" = "backtest_90d" ]; then
              python -m src.main --backtest --once --mark-session-date "$NY_DATE"
            elif [ "${{ inputs.mode }}" = "live_session_2h" ]; then
              python -m src.main --loop --interval 30 --max-minutes 115 --send-opening-report --mark-session-date "$NY_DATE"
            else
              python -m src.main --once --mark-session-date "$NY_DATE"
            fi
          else
            NY_H=$(TZ="America/New_York" date +%-H)
            NY_M=$(TZ="America/New_York" date +%-M)
            NY_S=$(TZ="America/New_York" date +%-S)
            NY_MINS=$((NY_H * 60 + NY_M))
            echo "Current New York Date: $NY_DATE | Time: $(TZ='America/New_York' date +%H:%M:%S) ($NY_MINS mins)"

            # Check if we already ran today's session by inspecting config/latest_scan.json
            LAST_RUN_DATE=""
            if [ -f "config/latest_scan.json" ]; then
              LAST_RUN_DATE=$(python -c "import json; d=json.load(open('config/latest_scan.json')); print(str(d.get('ny_session_date','')))" 2>/dev/null || echo "")
            fi

            if [ "$LAST_RUN_DATE" = "$NY_DATE" ] && [ "$NY_MINS" -ge 690 ]; then
              echo "Today's 2-hour session ($NY_DATE) already completed. Skipping duplicate cron."
              exit 0
            fi

            # Market Open is 09:35 NY (575 mins), 2-Hour Window End is 11:30 NY (690 mins)
            if [ "$NY_MINS" -ge 490 ] && [ "$NY_MINS" -lt 575 ]; then
              NOW_SEC=$((NY_H * 3600 + NY_M * 60 + NY_S))
              WAIT_SEC=$(( 575 * 60 - NOW_SEC ))
              echo "Pre-warmed runner arrived early. Waiting $WAIT_SEC seconds until exact 09:35 NY..."
              if [ "$WAIT_SEC" -gt 0 ]; then
                sleep "$WAIT_SEC"
              fi
              python -m src.main --loop --interval 30 --max-minutes 115 --send-opening-report --mark-session-date "$NY_DATE"
            elif [ "$NY_MINS" -ge 575 ] && [ "$NY_MINS" -lt 690 ]; then
              REM_MINS=$(( 690 - NY_MINS ))
              if [ "$REM_MINS" -lt 1 ]; then REM_MINS=1; fi
              echo "In active 2-hour market window. Running live loop for $REM_MINS minutes..."
              python -m src.main --loop --interval 30 --max-minutes "$REM_MINS" --send-opening-report --mark-session-date "$NY_DATE"
            elif [ "$NY_MINS" -lt 575 ]; then
              echo "Before 09:35 NY open ($NY_H:$NY_M NY). Skipping pre-market scan."
              exit 0
            else
              # GitHub cron arrived late after 11:30 NY -> still run a full scan & notify if today wasn't scanned yet!
              if [ "$LAST_RUN_DATE" != "$NY_DATE" ]; then
                echo "GitHub cron arrived late ($NY_H:$NY_M NY), executing daily scan & notification now..."
                python -m src.main --once --mark-session-date "$NY_DATE"
              else
                echo "Already scanned today ($NY_DATE). Exiting."
              fi
            fi
          fi

      - name: Commit & Push Updated Paper Trades and Dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/ docs/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Day Option Scan, Paper Trades & Dashboard"
            for i in 1 2 3 4 5; do
              echo "Push attempt $i..."
              git pull --rebase origin main && git push && break || sleep 5
            done
          fi
